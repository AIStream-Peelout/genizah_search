name: Build and Smoke Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    name: Build Images and Verify Startup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create stub .env for build
        run: |
          # Provide the values CI actually needs to build and start containers.
          # These are not production secrets — just enough for the smoke test.
          cat > .env << EOF
          ELASTICSEARCH_HOST=${{ secrets.ELASTICSEARCH_HOST }}
          ELASTICSEARCH_USERNAME=${{ secrets.ELASTICSEARCH_USERNAME }}
          ELASTICSEARCH_PASSWORD=${{ secrets.ELASTICSEARCH_PASSWORD }}
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          ENVIRONMENT=ci
          ALLOWED_ORIGINS=*
          EOF

      - name: Build all images
        run: docker compose -f docker-compose-prod.yml build --no-cache

      - name: Start all services
        run: docker compose -f docker-compose-prod.yml up -d

      - name: Wait for containers to initialize
        run: sleep 30

      - name: Verify no containers exited on startup
        run: |
          echo "Container status:"
          docker compose -f docker-compose-prod.yml ps

          EXITED=$(docker compose -f docker-compose-prod.yml ps --status exited --quiet)
          if [ -n "$EXITED" ]; then
            echo ""
            echo "❌ One or more containers exited unexpectedly:"
            docker compose -f docker-compose-prod.yml ps --status exited
            echo ""
            echo "--- Logs from failed containers ---"
            docker compose -f docker-compose-prod.yml logs
            exit 1
          fi

          echo "✅ All containers are running"

      - name: Smoke test backend health endpoint
        run: |
          if curl -sf http://localhost:8000/health; then
            echo "✅ Backend health check passed"
          else
            echo "❌ Backend health check failed"
            docker compose -f docker-compose-prod.yml logs backend
            exit 1
          fi

      - name: Smoke test frontend
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
          if [ "$STATUS" = "200" ]; then
            echo "✅ Frontend responding (HTTP $STATUS)"
          else
            echo "❌ Frontend returned HTTP $STATUS"
            docker compose -f docker-compose-prod.yml logs frontend
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose-prod.yml down --volumes --remove-orphans