name: Secret Guard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  no-tracked-env:
    name: No tracked .env files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject tracked runtime environment files
        run: python3 scripts/check_no_tracked_env.py
