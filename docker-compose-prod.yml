version: '3.8'
services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 8.8.4.4
    env_file:
      - .env
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - ENVIRONMENT=production
      - ALLOWED_ORIGINS=*
    volumes:
      # Add this volume mount for the embedding cache
      - /app/cache/embedding_cache:/app/embedding_cache
      # This ensures the cache persists and has proper permissions

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://PLACEHOLDER_VM_IP:8000
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://34.63.127.202:8000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru