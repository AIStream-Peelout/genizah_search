services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 8.8.4.4
    env_file:
      - .env
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - ENVIRONMENT=${ENVIRONMENT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - CORS_ORIGINS=${CORS_ORIGINS}
    volumes:
      - ./cache/embedding_cache:/app/embedding_cache
      - ./logs:/app/logs
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=https://api.cairogenizah.ai
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=https://api.cairogenizah.ai
    depends_on:
      - backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.2
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - "ES_JAVA_OPTS=-Xms1g -Xmx2g"  # Adjust based on your MacBook's RAM
      - cluster.routing.allocation.disk.watermark.low=85%
      - cluster.routing.allocation.disk.watermark.high=90%
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
      - ./backups/elasticsearch:/usr/share/elasticsearch/backup
    ports:
      - "9200:9200"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.2
    ports:
      - "5601:5601"
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
      - ELASTICSEARCH_SERVICEACCOUNTTOKEN=${ELASTICSEARCH_SERVICEACCOUNTTOKEN}
      - ELASTICSEARCH_SSL_VERIFICATIONMODE=certificate
      # Optional: Configure Kibana settings
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
      - LOGGING_QUIET=true
    volumes:
      - kibana_data:/usr/share/kibana/data
    depends_on:
      - elasticsearch

volumes:
  elasticsearch_data:
    driver: local
  kibana_data:
    driver: local