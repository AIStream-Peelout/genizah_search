<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #f5f3ee; color: #1e1c18; }
  header { position: sticky; top: 0; background: #2c2a25; color: #f5f3ee; padding: 10px 18px;
           display: flex; gap: 14px; align-items: center; flex-wrap: wrap; z-index: 5; }
  header input { padding: 5px 8px; border-radius: 5px; border: none; }
  header button { padding: 6px 12px; border-radius: 5px; border: none; background: #c9a86a; cursor: pointer; font-weight: 600; }
  .progress { opacity: 0.85; font-size: 0.9em; }
  main { max-width: 1200px; margin: 0 auto; padding: 18px; }
  .case { background: #fff; border: 1px solid #d8d2c4; border-radius: 8px; margin-bottom: 26px; padding: 16px 18px; }
  .case h2 { margin: 0 0 4px; font-size: 1.05em; }
  .question { font-size: 1.05em; margin: 8px 0 2px; }
  .history { background: #faf8f2; border-left: 3px solid #c9a86a; padding: 8px 10px; margin: 8px 0;
             font-size: 0.88em; white-space: pre-wrap; max-height: 160px; overflow-y: auto; }
  .answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; margin-top: 12px; }
  .answer { border: 1px solid #e2dccd; border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; }
  .answer h3 { margin: 0 0 6px; font-size: 0.92em; color: #6a5b3a; }

  .grades { display: grid; grid-template-columns: 1fr 64px; gap: 4px 8px; margin-top: 8px; font-size: 0.85em; align-items: center; }
  .grades input[type=number] { width: 56px; padding: 3px; }
  .verdict { margin-top: 8px; font-size: 0.9em; }
  textarea { width: 100%; box-sizing: border-box; min-height: 44px; margin-top: 6px; font-size: 0.88em; }
  .judge { font-size: 0.82em; background: #f2efe6; border-radius: 4px; padding: 6px 8px; margin-top: 8px; display: none; }
  body.show-judge .judge { display: block; }
  .prefer { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #d8d2c4; font-size: 0.92em; }
  .meta { font-size: 0.78em; color: #7a7466; }
  .done { outline: 3px solid #7da87b; }

nt Bibles without Masorah, paper Bibles, and one-column parchment Bibles (Arrant, p. 64).", "reason": "The answer fully supports the query by citing Arrant's typology of codices (p. 64), which is directly from the retrieved evidence. It includes both physical/codicological and linguistic dimensions as required, and references key pages (2, 3, 25, 64) that support the claims about non-model codices and linguistic features."}, {"criterion": "groundedness_and_accuracy", "status": "PASS", "answer_evidence": "\"Paper Bibles were characteristically affordable and easier to produce, making them the ‘common’ Bible par excellence.' (Arrant, p. 25)", "reason": "The quotation is directly from the source text (p. 25) and is under 30 words. The claim about paper Bibles being the most numerous and varied is supported by Arrant's analysis (p. 25), and the claim about non-model codices lacking Masorah is grounded in the evidence (p. 25, 3)."}, {"criterion": "citation_and_quote_quality", "status": "PASS", "answer_evidence": "\"Paper Bibles were characteristically affordable and easier to produce, making them the ‘common’ Bible par excellence.' (Arrant, p. 25)", "reason": "The quotation is verbatim from the source and appears in the context of the paper Bibles typology. It is directly supported by the evidence and does not exceed 30 words. All shelf marks and citations are from the retrieved sources and match the evidence."}, {"criterion": "synthesis_and_coherence", "status": "PASS", "answer_evidence": "The typology also accounts for two-column parchment Bibles that lack Masorah, which scholars examine to trace the transition from formal to common biblical production (Arrant, p. 25).", "reason": "The synthesis effectively connects codicological features (lack of Masorah) to broader historical and textual significance (transition from formal to common production), using only evidence from Arrant's work. The flow is logical and directly supported by the retrieved pages."}, {"criterion": "restraint_and_limitations", "status": "PASS", "answer_evidence": "The retrieved scholarship does not record detailed colophon data, precise dating, or comprehensive provenance records for these specific codices.", "reason": "The answer explicitly states a limitation when the evidence does not support detailed provenance or dating, as required by the rubric. This restraint is appropriate and directly reflects the absence of such data in the retrieved sources."}], "unsupported_claims": [], "overall_pass": true, "summary": "The answer is excellent, precise, and well-supported by retrieved Cairo Genizah scholarship. It accurately addresses the user's intent with clear, grounded claims about codices, citing specific pages and quotations from Estara Arrant's work. It distinguishes scholarly analysis from catalog entries, avoids invented details, and appropriately limits claims where evidence is absent.", "score_mean": 4.0, "computed_overall_pass": true, "reported_pass_matches_rule": true}, "deterministic_pass": true, "metrics": {"elapsed_seconds": 116.825, "verification_cycles": 4, "repair_attempts": 3}}, {"model": "qwen/qwen3.8-27b", "source_file": "merged_3_8_27b.jsonl", "answer": "\n\nThe retrieved scholarship that directly addresses biblical codices is **Arrant**’s typology of common Torah codices (**Arrant**, p. 2). **Arrant** situates the Genizah within a broad medieval Jewish culture: **Arrant**, p. 2: \"many of the resultant objects of its prolific writing activity were deposited in a synagogue attic in Cairo, the Cairo Genizah\".\n\nThe scale of the biblical material is emphasized for the Cambridge collections: **Arrant**, p. 2: \"the Taylor-Schechter and Lewis Gibson collections at the Cambridge University Library\". **Arrant**, p. 2: \"They hold around 25,000 fragments of the entire Hebrew Bible, and more thousands of fragments of Bible translation in Arabic and Aramaic\". These are not only formal, “model” Bibles: **Arrant**, p. 2: \"the Cairo Genizah did not contain only ‘model’ Bibles which have a beautiful, formal layout\".\n\nFor the Torah specifically, **Arrant** focuses on copies that \"lack the qualities associated with a ‘model’ codex of the Hebrew Bible\" (**Arrant**, p. 3). These are common/non-model manuscripts: **Arrant**, p. 3: \"Such ‘common’/ ‘non-model’ MSS reflect the copying and transmission of the scripture beyond expensive codices produced for reference in the synagogue\". They show great physical and textual variation: **Arrant**, p. 3: \"This resulted in a tremendous level of variation in the physical and written form of Bible codices produced during this period and housed in the Genizah.\" They are also likely numerous: **Arrant**, p. 3: \"they are likely the most numerous type of Bible housed in the Genizah\". Their scribal origins are varied: **Arrant**, p. 3: \"They could be written by professional scribes, by laymen, or even by children\". Many also show non-standard Tiberian vocalization: **Arrant**, p. 3: \"many also contain vocalisation features which have been called in recent scholarship non-standard Tiberian\". **Arrant** notes that these types have been insufficiently classified: **Arrant**, p. 3: \"Common/non-model Bibles and NST have, for the most part, remained understudied and under-classified\".\n\n**Arrant** organizes the analysis into four biblical corpora: **Arrant**, p. 64: \"The thesis is organised into four analytical chapters based on the corpora established above:\" and **Arrant**, p. 64: \"(1) Unprofessional Bibles (2) 2CP (two column parchment) Bibles without Masorah (3) Paper Bibles (4) 1CP (one column parchment) Bibles with or without Masorah.\"\n\nFor two-column parchment Bibles without Masorah, **Arrant** argues that they form a distinct group: **Arrant**, p. 25: \"I examine 2CP Bibles which lack Masorah and conclude that they are distinct from their near-model codex peers which have Masorah.\" They are not a uniform class: **Arrant**, p. 25: \"They range in sophistication from non-model to completely common.\"\n\nFor one-column parchment Bibles, **Arrant** places them below the two-column corpus: **Arrant**, p. 25: \"Below the level of 2CP Bibles lies the 1CP corpus.\" Masoretic notes are less decisive at this level: **Arrant**, p. 25: \"Masoretic notes seem to cease to be very typologically important at this level\" and **Arrant**, p. 25: \"only a small amount (~ 15%) had full Masorah\".\n\nPaper Bibles are presented as especially characteristic of the “common” Bible: **Arrant**, p. 25: \"Paper Bibles were characteristically affordable and easier to produce, making them the ‘common’ Bible par excellence.\" They are also the most numerous type: **Arrant**, p. 25: \"These are the most numerous of Bible types in the Genizah\" and **Arrant**, p. 25: \"have an extremely large amount of feature variation\".\n\nThe only shelf mark identified in the retrieved source is T-S Ar. 1a-54 (**Arrant**, p. 2); the retrieved text does not describe its contents. The retrieved scholarship does not record a broader set of shelf marks for individual biblical codices, so the answer is typological rather than a catalogue of named codices.\n\n---\n**Related catalog entries:**\n\n- **[Halper 331](doc:Philadelphia_CAJS_Halper_331)**\n  Ketubba, beginning only. The scribe interrupted the draft after the date in the seventh line, probably because the day i\n\n---\n**Works cited:**\n\n- **Estara Arrant**, A Codicological and Linguistic Typology of Common Torah Codices from the Cairo Genizah\n- **Moshe Gil / משה גיל**, [In the Kingdom of Ishmael / במלכות ישמעאל](https://www.nli.org.il/en/books/NNL_ALEPH001758445/NLI)\n\n---\n**Manuscripts these works are based on:**\n\n- **A Codicological and Linguistic Typology of Common Torah Codices from the Cairo Genizah** — [Cambridge CUL: T-S A25.193](doc:Cambridge_CUL_T_S_A25_193), [Cambridge CUL: T-S NS 7.21](doc:Cambridge_CUL_T_S_NS_7_21), [Cambridge CUL: T-S NS 8.28](doc:Cambridge_CUL_T_S_NS_8_28), [Cambridge C eserves important Palestinian-style marriage contracts, particularly from the end of the Gaonic period. **Friedman**, p. 9.\n\nThese Geniza documents provide crucial comparative material for understanding early proposal and acceptance clauses. Scholars analyzing these texts note specific linguistic variations in the second-person feminine singular pronoun used in proposal clauses, observing that certain restorations of the formula are doubtful due to grammatical inconsistencies.\n\nThe retrieved scholarship does not record specific shelf marks, dates, or scribes for the Geniza ketubbot, nor does it detail the full range of financial stipulations or conduct clauses found in these contracts. The available texts focus primarily on the historical development of the formulary, the distinction between Babylonian and Palestinian traditions, and the linguistic analysis of proposal and acceptance formulae.\n\n---\n**Related catalog entries:**\n\n- **[T-S AS 153.214](doc:Cambridge_CUL_T_S_AS_153_214)**\n  Late business letter in Hebrew from Shemuel Bahlul in Manzala (near Damietta) to Shemuʾel ___[?} in Cairo (מצרים). Infor\n\n---\n**Works cited:**\n\n- **Mordechai Akiva Friedman**, [Jewish Marriage in Palestine: The Kettubba texts](https://openlibrary.org/works/OL5014258W)\n- **Richard J. H. Gottheil, William Hoyt Worrell**, [Fragments from the Cairo genizah in the Freer Collection](https://doi.org/10.3998/mpub.12945702)\n- **Moshe Gil / משה גיל**, [In the Kingdom of Ishmael / במלכות ישמעאל](https://www.nli.org.il/en/books/NNL_ALEPH001758445/NLI)\n- **Benyamin Menashe Levin / בנימין מנשה לוין**, [Ginzei Kedem / גנזי קדם](https://doi.org/10.35623/gq16dm20tu)\n- **אברהם דוד / Abraham David**, מעורבותם של יהודי רשיד (Rosetta) שבמצרים בעסקי מסחר במאה השש־עשרה על פי מסמכי הגניזה הקהירית / The Involvement of the Jews of Rosetta, Egypt in Commerce in the Sixteenth Century According to Cairo Genizah Documents\n\n---\n**Manuscripts these works are based on:**\n\n- **Jewish Marriage i an**, p. 9: “Their very antiquity restricts them from serving as sources for the study of the particular Palestinian traditions of the ketubba”. His introduction then turns to the Cairo Genizah fragments, especially Palestinian-style contracts **Friedman**, p. 9.\n\nThe legal significance of the contract’s wording is central. **Friedman**, p. 2: “The text of the ketubba (plural ketubbot), the Jewish marriage contract, is designated in Tannaitic sources as leshon hedyot”. Its formula had begun to crystallize early: **Friedman**, p. 2: “By the late second Temple period and the early second century, its formula had begun to crystalize.” The Tannaim treated its wording as legally meaningful: **Friedman**, p. 2: “The Tannaim attached legal significance to its precise wording and formulation and based halakhic decisions on it.” They also developed it: **Friedman**, p. 2: “They also added to the formulary and emended it.” Hai Gaon’s explanation of this interpretive process is quoted by Friedman: **Friedman**, p. 2: “They examined in detail the language which laymen wrote in their documents and interpreted it in the same way,”.\n\nIn the ketubba fragments he discusses, Friedman observes that the basic formulary is usually Babylonian: **Friedman**, p. 7: “the basic formulary essentially conforms with the Babylonian tradition of the ketubba”. He associates that Babylonian formulary with the Geonim and their responsa: **Friedman**, p. 7: “known primarily from the formularies of the Babylonian Geonim and from citations in their responsa”. Yet the fragments are not uniform: **Friedman**, p. 7: “Similarly, these fragments include various types of special stipulations dealing with the conduct of the groom and bride and their obligations”.\n\nFor the Cairo Genizah specifically, Friedman’s section on effecting marriage analyzes proposal and acceptance: **Friedman**, p. 159: “The proposal formulae of the Palestinian ketubbot from the Geniza”. He uses them comparatively: **Friedman**, p. 159: “are of some assistance to us in reading and restoring the fragmentary marriage contracts”. This shows that the Genizah’s Palestinian formulae are valuable for reconstructing earlier marriage-law practice, especially in relation to the Judean Desert contracts he discusses **Friedman**, p. 159.\n\n⟦flag:1⟧A limitation: the retrieved pages of **Friedman** (pp. 2, 7, 9, 159) do not record specific Cairo Genizah shelf marks for the ketubbot; they discuss formulary types, stipulations, and proposal/acceptance formulae rather than individual fragment identifiers.⟦/flag⟧\n\n---\n**Related catalog entries:**\n\n- **[T-S AS 153.214](doc:Cambridge_CUL_T_S_AS_153_214)**\n  Late business letter in Hebrew from Shemuel Bahlul in Manzala (near Damietta) to Shemuʾel ___[?} in Cairo (מצרים). Infor\n\n---\n**Works cited:**\n\n- **Mordechai Akiva Friedman**, [Jewish Marriage in Palestine: The Kettubba texts](https://openlibrary.org/works/OL5014258W)\n- **Richard J. H. Gottheil, William Hoyt Worrell**, [Fragments from the Cairo genizah in the Freer Collection](https://doi.org/10.3998/mpub.12945702)\n- **Moshe Gil / משה גיל**, [In the Kingdom of Ishmael / במלכות ישמעאל](https://www.nli.org.il/en/books/NNL_ALEPH001758445/NLI)\n- **Benyamin Menashe Levin / בנימין מנשה לוין**, [Ginzei Kedem / גנזי קדם](https://doi.org/10.35623/gq16dm20tu)\n- **אברהם דוד / Abraham David**, מעורבותם של יהודי רשיד (Rosetta) שבמצרים בעסקי מסחר במאה השש־עשרה על פי מסמכי הגניזה הקהירית / The Involvement of the Jews of Rosetta, Egypt in Commerce in the Sixteenth Century According to Cairo Genizah Documents\n\n---\n**Manuscripts these works are based on:**\n\n- **Jewish Marriage in Palestine: The Kettubba texts** — [T-S NS J48](doc:Cambridge_CUL_T_S_NS_J48), [T-S NS J283](doc:Cambridge_CUL_T_S_NS_J283), [T-S NS J45](doc:Cambridge_CUL_T_S_NS_J45), [T-S NS J460](doc:Cambridge_CUL_T_S_NS_J460), [T-S Misc.8.87](doc:Cambridge_CUL_T_S_Misc_8_87), [T-S Misc.27.4.23](doc:Cambridge_CUL_T_S_Misc_27_4_23), [T-S Misc
