recise wording. Later authorities, including Hai Gaon, explained the halakhic methodology of \"interpreting laymen's formulary\" by closely examining the detailed language laymen used in their documents.\n\nWithin the Geniza corpus, these contracts contain special stipulations addressing the conduct of the groom and bride, adapted to the parties' status and specific needs. Furthermore, the proposal and acceptance formulae preserved in later Palestinian Geniza ketubbot provide critical reference points for scholars. **Friedman**, p. 159: \"The proposal formulae of the Palestinian ketubbot from the Geniza\" assist in reading and restoring earlier fragmentary marriage contracts, bridging the textual gap between later documentary evidence and earlier Mishnaic-period documents.\n\nThe retrieved scholarship does not record specific shelf marks or scribe attributions for these Geniza ketubbot, nor does it provide a comprehensive catalog of individual fragments. The available analysis focuses primarily on Friedman’s examination of Palestinian ketubba traditions, their formulary development, and their comparative value for reconstructing Jewish marriage law.\n\n---\n**Related catalog entries:**\n\n- **[T-S AS 153.214](doc:Cambridge_CUL_T_S_AS_153_214)**\n  Late business letter in Hebrew from Shemuel Bahlul in Manzala (near Damietta) to Shemuʾel ___[?} in Cairo (מצרים). Infor\n\n---\n**Works cited:**\n\n- **Mordechai Akiva Friedman**, [Jewish Marriage in Palestine: The Kettubba texts](https://openlibrary.org/works/OL5014258W)\n- **Richard J. H. Gottheil, William Hoyt Worrell**, [Fragments from the Cairo genizah in the Freer Collection](https://doi.org/10.3998/mpub.12945702)\n- **Moshe Gil / משה גיל**, [In the Kingdom of Ishmael / במלכות ישמעאל](https://www.nli.org.il/en/books/NNL_ALEPH001758445/NLI)\n- **Benyamin Menashe Levin / בנימין מנשה לוין**, [Ginzei Kedem / גנזי קדם](https://doi.org/10.35623/gq16dm20tu)\n- **אברהם דוד / Abraham David**, מעורבותם של יהודי רשיד (Rosetta) rriage contracts, particularly from the end of the Gaonic period. **Friedman**, p. 9.\n\nThese Geniza documents provide crucial comparative material for understanding early proposal and acceptance clauses. Scholars analyzing these texts note specific linguistic variations in the second-person feminine singular pronoun used in proposal clauses, observing that certain restorations of the formula are doubtful due to grammatical inconsistencies.\n\nThe retrieved scholarship does not record specific shelf marks, dates, or scribes for the Geniza ketubbot, nor does it detail the full range of financial stipulations or conduct clauses found in these contracts. The available texts focus primarily on the historical development of the formulary, the distinction between Babylonian and Palestinian traditions, and the linguistic analysis of proposal and acceptance formulae.\n\n---\n**Related catalog entries:**\n\n- **[T-S AS 153.214](doc:Cambridge_CUL_T_S_AS_153_214)**\n  Late business letter in Hebrew from Shemuel Bahlul in Manzala (near Damietta) to Shemuʾel ___[?} in Cairo (מצרים). Infor\n\n---\n**Works cited:**\n\n- **Mordechai Akiva Friedman**, [Jewish Marriage in Palestine: The Kettubba texts](https://openlibrary.org/works/OL5014258W)\n- **Richard J. H. Gottheil, William Hoyt Worrell**, [Fragments from the Cairo genizah in the Freer Collection](https://doi.org/10.3998/mpub.12945702)\n- **Moshe Gil / משה גיל**, [In the Kingdom of Ishmael / במלכות ישמעאל](https://www.nli.org.il/en/books/NNL_ALEPH001758445/NLI)\n- **Benyamin Menashe Levin / בנימין מנשה לוין**, [Ginzei Kedem / גנזי קדם](https://doi.org/10.35623/gq16dm20tu)\n- **אברהם דוד / Abraham David**, מעורבותם של יהודי רשיד (Rosetta) שבמצרים בעסקי מסחר במאה השש־עשרה על פי מסמכי הגניזה הקהירית / The Involvement of the Jews of Rosetta, Egypt in Commerce in the Sixteenth Century According to Cairo Genizah Documents\n\n---\n**Manuscripts these works are based on:**\n\n- **Jewish Marriage in Palestine: The Kettubba texts** — [T function store() { try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { return {}; } }
function save(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); updateProgress(); }
function annKey(caseKey, model) { return caseKey + "@@" + model; }

function updateProgress() {
  const s = store();
  let total = 0, done = 0;
  for (const c of DATA) for (const a of c.answers) {
    total += 1;
    const ann = s[annKey(c.key, a.model)] || {};
    if (ann.verdict) done += 1;
  }

    el.classList.toggle("done", Boolean(ann.verdict));

}

function setField(caseKey, model, field, value) {
  const s = store();
  const k = annKey(caseKey, model);
  s[k] = s[k] || { case_key: caseKey, model: model, scores: {} };
  if (field.startsWith("score:")) s[k].scores[field.slice(6)] = value === "" ? null : Number(value);

  s[k].updated_at = new Date().toISOString();
  save(s);
}
function setCaseField(caseKey, field, value) {
  const s = store();

  s[k].updated_at = new Date().toISOString();

function fieldValue(caseKey, model, field) {
