# frontend/nginx.conf
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;


    # Long route keys (blog post paths) need a bigger map hash bucket than the 64-byte default.
    map_hash_bucket_size 256;

    # Per-route <title> / description for the single-page app (see docs/seo_plan.md).
    # Values must not contain single quotes. The festival pages have their own blocks below.
    # $page_path is set in the locations below before try_files rewrites $uri to /index.html.
    map $page_path $page_title {
        default "Cairo Genizah AI";
        "/"          "Cairo Genizah AI: search 70,000 medieval manuscript fragments";
        "/about"     "About Cairo Genizah AI: from medieval documents to language models";
        "/faq"       "FAQ: how to use Cairo Genizah AI";
        "/map"       "Places map: the world of the Cairo Genizah";
        "/explorer"  "Collection Explorer: 70,000 Genizah fragments mapped by similarity";
        "/chat"      "Research assistant: ask questions about the Cairo Genizah";
        "/blog"      "Blog: how Cairo Genizah AI searches, clusters and transcribes the Genizah";
        "/holidays"  "Holiday archive: Sukkot and Yom Kippur in the Cairo Genizah";
        "/blog/transcribing-the-cairo-genizah-with-multimodal-ai" "Transcribing the Cairo Genizah with Multimodal AI: AI transcription of medieval manuscripts";
        "/blog/multimodal-ai-for-manuscript-discovery-searching-and-clustering-the-cairo-genizah" "Multimodal AI for Medieval Manuscript Discovery: Searching and Clustering the Cairo Genizah";
    }
    map $page_path $page_desc {
        default "AI for the Cairo Genizah: semantic search over 70,000+ medieval manuscript fragments, machine transcription shown line by line on the manuscript, a research assistant grounded in scholarship, and maps of the people and places in the documents.";
        "/"          "AI for the Cairo Genizah: semantic search over 70,000+ medieval manuscript fragments, machine transcription shown line by line on the manuscript, a research assistant grounded in scholarship, and maps of the people and places in the documents.";
        "/about"     "Why an AI search for the Cairo Genizah, what AI can do for the fragments and what the fragments can do for AI, how the site works, data credits and limits.";
        "/faq"       "Answers on searching by meaning, shelf marks, machine transcription, the research assistant, the data sources and the limits of Cairo Genizah AI.";
        "/map"       "An interactive map of places named in Cairo Genizah fragments, the libraries that hold them, and the people and journeys the documents record.";
        "/explorer"  "Explore 70,000 Cairo Genizah fragments laid out by textual similarity: related documents cluster together so genres and themes emerge at a glance.";
        "/chat"      "A research assistant that answers questions about the Cairo Genizah from published scholarship and a knowledge graph, citing its sources and flagging unsupported claims.";
        "/blog"      "Articles on searching, clustering and transcribing the Cairo Genizah with multimodal AI, summarised with links to the full texts on Medium.";
        "/holidays"  "Pages built for holidays, kept online: Genizah fragments on Sukkot and Yom Kippur, their prayers, customs and documents, with machine readings on the manuscripts.";
        "/blog/transcribing-the-cairo-genizah-with-multimodal-ai" "How Cairo Genizah fragments are transcribed with multimodal AI: fine-tuned vision-language models for Hebrew and Judeo-Arabic, Kraken HTR, two-reader consensus.";
        "/blog/multimodal-ai-for-manuscript-discovery-searching-and-clustering-the-cairo-genizah" "How multimodal embeddings (CLIP, ColPali, Nomic) search and cluster Cairo Genizah fragments, and how the first version of Cairo Genizah AI was built.";
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html index.htm;

        # Handle client-side routing
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Titles and descriptions for the app's main routes (values from the maps above).
        location ~ ^/(about|faq|map|explorer|chat|blog|holidays)$ {
            set $page_path $uri;
            try_files /index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter '<title>Cairo Genizah AI</title>' '<title>$page_title</title>';
            sub_filter 'Cairo Genizah AI: search, read and map 70,000 medieval manuscripts with AI' '$page_title';
            sub_filter 'AI for the Cairo Genizah: semantic search over 70,000+ medieval manuscript fragments, machine transcription shown line by line on the manuscript, a research assistant grounded in scholarship, and maps of the people and places in the documents.' '$page_desc';
            sub_filter '"https://cairogenizah.ai/"' '"https://cairogenizah.ai$page_path"';
        }
        # Blog posts: same body, so each post gets its own title, description and canonical URL.
        location ~ ^/blog/[a-z0-9-]+$ {
            set $page_path $uri;
            try_files /index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter '<title>Cairo Genizah AI</title>' '<title>$page_title</title>';
            sub_filter 'Cairo Genizah AI: search, read and map 70,000 medieval manuscripts with AI' '$page_title';
            sub_filter 'AI for the Cairo Genizah: semantic search over 70,000+ medieval manuscript fragments, machine transcription shown line by line on the manuscript, a research assistant grounded in scholarship, and maps of the people and places in the documents.' '$page_desc';
            sub_filter '"https://cairogenizah.ai/"' '"https://cairogenizah.ai$page_path"';
        }
        location = / {
            set $page_path $uri;
            try_files /index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter '<title>Cairo Genizah AI</title>' '<title>$page_title</title>';
        }

        # Per-page link previews. The SPA serves one index.html for every
        # route, so crawlers (WhatsApp, Facebook, Slack, Google) would show the
        # site-wide card for the Yom Kippur and Sukkot pages. Rewrite their title, description,
        # preview image and canonical URL in the response body instead. The
        # search strings must match public/index.html exactly (values only, so
        # CRA's HTML minifier cannot break the match).
        location ~ ^/(yom-kippur|yk)$ {
            try_files /index.html =404;
            # add_header in a location replaces the server-level set, so repeat them.
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter '<title>Cairo Genizah AI</title>' '<title>Yom Kippur in the Cairo Genizah</title>';
            sub_filter 'Cairo Genizah AI: search, read and map 70,000 medieval manuscripts with AI' 'Yom Kippur in the Cairo Genizah';
            sub_filter 'AI for the Cairo Genizah: semantic search over 70,000+ medieval manuscript fragments, machine transcription shown line by line on the manuscript, a research assistant grounded in scholarship, and maps of the people and places in the documents.' 'Thirteen fragments of Yom Kippur liturgy from the Cairo Genizah, read by machine and shown line by line on the manuscript. A one-time page for Yom Kippur 5787.';
            sub_filter '/og-image.jpg' '/og-yom-kippur.jpg';
            sub_filter '"https://cairogenizah.ai/"' '"https://cairogenizah.ai/yom-kippur"';
        }

        # Same rewrite for the permanent Sukkot page (and its /sk short link).
        location ~ ^/(sukkot|sk)$ {
            try_files /index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            sub_filter_once off;
            sub_filter_types text/html;
            sub_filter '<title>Cairo Genizah AI</title>' '<title>Exploring Sukkot through the Cairo Genizah</title>';
            sub_filter 'Cairo Genizah AI: search, read and map 70,000 medieval manuscripts with AI' 'Exploring Sukkot through the Cairo Genizah';
            sub_filter 'AI for the Cairo Genizah: semantic search over 70,000+ medieval manuscript fragments, machine transcription shown line by line on the manuscript, a research assistant grounded in scholarship, and maps of the people and places in the documents.' 'Sukkot in the Cairo Genizah: hoshanot and the Day of the Willow, the Mount of Olives assembly, palm branches and citrons, the synagogue sukkah, Simhat Torah and the calendar dispute of 921, in medieval manuscript fragments.';
            sub_filter '/og-image.jpg' '/og-sukkot.jpg';
            sub_filter '"https://cairogenizah.ai/"' '"https://cairogenizah.ai/sukkot"';
        }

        # index.html must never be cached: it names the content-hashed JS and
        # CSS bundles, so a stale copy keeps loading the previous deploy's
        # assets and users see no updates until they hard-refresh.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            expires -1;
        }

        # Hashed build assets are immutable: a new build produces new
        # filenames, so these are safe to cache aggressively.
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}