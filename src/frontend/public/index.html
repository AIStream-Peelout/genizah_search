    <style>
        /* Loading spinner styles */
        #initial-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .loader-subtext {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>

<body>
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-M34LHQKP"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

<noscript>You need to enable JavaScript to run this app.</noscript>

<!-- Initial loading screen -->
<div id="initial-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading Cairo Genizah AI</div>
    <div class="loader-subtext">Preparing AI-powered manuscript search...</div>
</div>

<!-- React app mounts here -->
<div id="root"></div>

<script>
    // Hide loader once React app loads
    window.addEventListener('load', function() {
        setTimeout(function() {
            const loader = document.getElementById('initial-loader');
            if (loader) {
                loader.style.opacity = '0';
                loader.style.transition = 'opacity 0.5s ease-out';
                setTimeout(() => {
                    loader.style.display = 'none';
                }, 500);
            }
        }, 1000);
    });
</script>
</body>
